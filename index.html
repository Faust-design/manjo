<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>manjo</title>
<meta name="theme-color" content="#edf1ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="manjo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <h1>manjo</h1>
    <p id="authLead">Meldet euch an. Danach seht ihr eure Listen auf jedem Gerät.</p>
    <form id="authForm" novalidate>
      <label class="sr" for="authEmail">E-Mail</label>
      <input class="field" id="authEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="E-Mail-Adresse" required>
      <label class="sr" for="authPw">Passwort</label>
      <input class="field" id="authPw" type="password" autocomplete="current-password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" required>
      <button class="primary" type="submit" id="authSubmit">Anmelden</button>
      <p class="msg" id="authMsg" aria-live="polite"></p>
    </form>
    <button class="alt" id="authToggle" type="button">Neu hier? Konto erstellen</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="hrow">
      <span class="brand">manjo</span>
      <span class="grow"></span>
      <span class="sync" id="sync" data-s="loading"><i class="dot"></i><span id="syncText">Verbinde</span></span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Märkte" hidden></div>
    <div class="sum" id="sumRow"><span id="sumText"></span><div class="bar" aria-hidden="true"><i id="barFill"></i></div><button class="shop-btn" id="shopBtn" data-act="shop" aria-pressed="false" aria-label="Einkaufsmodus" title="Bildschirm bleibt an, größere Zeilen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="lbl">Einkaufen</span></button></div>
  </header>

  <main id="main" tabindex="-1" aria-label="Inhalt"></main>

  <footer class="composer" id="composer">
    <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" data-act="undo">Rückgängig</button></div>
    <p class="hint" id="hint" aria-live="polite" hidden></p>
    <form id="addForm" autocomplete="off">
      <label class="sr" for="newItem">Artikel hinzufügen</label>
      <textarea id="newItem" rows="1" maxlength="2000" enterkeyhint="send" placeholder="Artikel hinzufügen"></textarea>
      <button class="ibtn" type="button" data-act="import" aria-label="Liste einfügen und sortieren"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"/></svg></button>
      <button class="add" type="submit" aria-label="Hinzufügen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <nav class="nav" id="nav" aria-label="Navigation">
      <div class="navin">
        <span class="slot" id="slot" aria-hidden="true"><i class="sunc"></i></span>
        <button class="nb" data-act="nav" data-view="list" aria-label="Listen" title="Liste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button class="nb" data-act="nav" data-view="markets" aria-label="Märkte" title="Märkte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg></button>
        <button class="nb" data-act="nav" data-view="bills" aria-label="Rechnungen" title="Rechnungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></button>
        <button class="nb" data-act="nav" data-view="settings" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="nb" data-act="nav" data-view="account" aria-label="Account" title="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      </div>
    </nav>
  </footer>
  <div class="sr" id="announce" aria-live="polite"></div>
</div>

<input type="file" id="rcFile" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h">
      <h2 id="sheetTitle"></h2>
      <button class="close" data-act="close" aria-label="Schließen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="sheet-sub" id="sheetSub"></p>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="lib/classify.js"></script>
<script src="lib/drag.js"></script>
<script src="lib/receipt.js"></script>
<script src="lib/ledger.js"></script>
<script src="lib/items.js"></script>
<script src="app.js"></script>
</body>
</html>
