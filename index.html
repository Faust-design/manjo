<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>manjo</title>
<meta name="theme-color" content="#edf1ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="manjo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#edf1ef; --surface:#f8faf9; --ink:#13211d; --ink-2:#46564f; --line:#cfd9d4; --rail:#9fb1aa;
  --accent:#ffd23f; --accent-2:#f59e0b; --on-accent:#13211d; --danger:#b3261e; --ok:#1f8a5b; --warn:#b26a00;
  --scrim:rgba(10,20,17,.5); --lift:0 12px 28px rgba(19,33,29,.22);
  --nav:rgba(70,80,36,.88); --nav-ink:#f7f0cc;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1815; --surface:#17231f; --ink:#eaf1ee; --ink-2:#9db0a9; --line:#2b3c36; --rail:#3f544d;
    --danger:#ff8f86; --ok:#4cd69a; --warn:#ffb74d; --scrim:rgba(0,0,0,.6); --lift:0 12px 28px rgba(0,0,0,.5);
    --nav:rgba(34,42,20,.9); --nav-ink:#f7f0cc; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1815; --surface:#17231f; --ink:#eaf1ee; --ink-2:#9db0a9; --line:#2b3c36; --rail:#3f544d;
  --danger:#ff8f86; --ok:#4cd69a; --warn:#ffb74d; --scrim:rgba(0,0,0,.6); --lift:0 12px 28px rgba(0,0,0,.5);
  --nav:rgba(34,42,20,.9); --nav-ink:#f7f0cc; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{text-wrap:pretty}
h1,h2,h3{margin:0}
h2{font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;text-wrap:balance}

.auth{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.auth-card{width:100%;max-width:380px}
.auth h1{margin:0 0 6px;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:34px;line-height:1}
.auth p{margin:0 0 16px;color:var(--ink-2)}
.auth form{display:grid;gap:10px}
.auth .primary{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;transition:transform 160ms var(--ease-out)}
.auth .primary:active{transform:scale(.98)}
.auth .msg{min-height:20px;margin:0;font-size:13px;color:var(--ink-2)}
.auth .msg.err{color:var(--danger)}
.auth .alt{margin-top:4px;min-height:44px;border:0;background:none;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{padding-top:6px;display:grid;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;min-height:30px}
.brand{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:24px;line-height:1;letter-spacing:-.01em}
.grow{flex:1}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync[data-s="live"] .dot{background:var(--ok)}
.sync[data-s="lost"] .dot{background:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 8px 0 14px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.tab:active{transform:scale(.97)}
.tab .tn{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tc{min-width:24px;height:22px;padding:0 6px;border-radius:11px;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tc{background:var(--accent);color:var(--on-accent)}
.sum{display:flex;align-items:center;gap:10px;padding-bottom:2px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease-out)}

/* Hauptbereich */
main{overflow-y:auto;overscroll-behavior:contain;padding:8px 0 14px;min-width:0;outline:none}
main.vin{animation:enterIn 200ms var(--ease-out) both}
main.dragging,main.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 10px;padding:2px 10px;margin:0 0 10px;border:1px dashed var(--rail);border-radius:10px;font-size:13px;color:var(--ink-2)}
.note p{margin:5px 0}

.route{list-style:none;margin:0;padding:0}
.stop{position:relative;padding-left:40px;padding-bottom:12px}
.stop::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--rail)}
.badge{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 5px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.badge.sm{min-width:22px;height:18px;font-size:12.5px;border-radius:4px;padding:0 4px}
.stop .badge{position:absolute;left:0;top:0}
.stop-h{display:flex;align-items:center;gap:8px;min-height:22px}
.count{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.end{position:relative;display:flex;align-items:center;min-height:22px;padding-left:40px;color:var(--ink-2)}
.end::before{content:"";position:absolute;left:13px;top:0;width:2px;height:5px;background:var(--rail)}
.end::after{content:"";position:absolute;left:7px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--rail);background:var(--bg)}
.end span{font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}

.items{list-style:none;margin:1px 0 0;padding:0}
.item{display:flex;align-items:stretch}
.item + .item{border-top:1px solid var(--line)}
.item.enter{animation:enterIn 240ms var(--ease-out) both}
@keyframes enterIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;padding:3px 0;border:0;background:none;text-align:left}
.box{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-2);transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
.box svg{opacity:0}
.row-main:active .box{transform:scale(.86)}
.row-main[aria-checked="true"] .box{background:var(--ink-2);border-color:var(--ink-2);color:var(--bg)}
.row-main[aria-checked="true"] .box svg{opacity:1}
.item.checking .box svg{animation:tick 220ms var(--ease-out) both}
@keyframes tick{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.name{min-width:0;overflow-wrap:anywhere;font-size:15.5px;font-weight:500;line-height:1.25;transition:color 160ms ease}
.done .name{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}
.more{flex:none;display:grid;place-items:center;width:40px;border:0;background:none;color:var(--ink-2)}
.more:active{color:var(--ink)}
button:disabled{cursor:default}
.row-main:disabled{opacity:.7}
@media (hover:hover) and (pointer:fine){
  .row-main:hover .box{border-color:var(--ink)}
  .more:hover,.icon-btn:hover{color:var(--ink)}
}
.cart{margin-top:2px;padding-top:8px;border-top:1px solid var(--line)}
.cart-h{display:flex;align-items:center;gap:8px}
.cart-h h2{color:var(--ink-2)}
.link{margin-left:auto;min-height:40px;padding:0 0 0 10px;border:0;background:none;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.allset{margin:0 0 10px;font-size:16px;font-weight:600}
.empty h2{font-size:22px;letter-spacing:.01em;text-transform:none;font-weight:800;margin-bottom:6px}
.empty p{margin:0 0 12px;max-width:40ch;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink-2);background:none;font-weight:600;transition:transform 160ms var(--ease-out)}
.chip:active{transform:scale(.97)}

/* Ansichten */
.bhead{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.bhead h2{font-size:20px;letter-spacing:.02em;text-transform:none;font-weight:800;font-family:var(--f-display);font-stretch:75%}
.bhead .sheet-btn{margin:0 0 0 auto;width:auto;min-height:40px;padding:0 12px;font-size:14px}
.set{margin:0 0 18px}
.set h3{margin:0 0 6px;font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tip{margin:0 0 8px;max-width:48ch;font-size:13px;color:var(--ink-2)}
.field{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--rail);background:var(--surface);font-size:16px}
.settle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:6px 0;border-top:1px solid var(--line)}
.settle:first-of-type{border-top:0}
.settle span{min-width:0;overflow-wrap:anywhere}
.settle b{font-variant-numeric:tabular-nums;white-space:nowrap}
.arr{color:var(--ink-2);margin:0 4px}
.balrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;border-top:1px solid var(--line)}
.balrow .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.bv.pos{color:var(--ok)}
.bv.neg{color:var(--danger)}
.exrow{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line);padding:4px 0}
.exm{flex:1;min-width:0;display:grid}
.exm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.exm span{font-size:12.5px;color:var(--ink-2)}
.exa{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Stationen bearbeiten */
.order-list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px;position:relative}
.ord{position:relative;display:flex;align-items:center;gap:8px;min-height:50px;padding:3px 2px 3px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ord-text{flex:1;min-width:0;display:grid}
.station-in{width:100%;height:32px;padding:0 6px;margin-left:-6px;border:1.5px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:600;text-overflow:ellipsis}
.station-in:focus{border-color:var(--rail);background:var(--bg)}
.ord-ex{font-size:12px;color:var(--ink-2);line-height:1.2;margin-top:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord.empty .station-in{color:var(--ink-2);font-weight:500}
.ord.shift,.ord.drop{transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.ord.lift{z-index:3;transition:none;box-shadow:var(--lift);border-color:var(--ink-2)}
.ord.drop{z-index:3}
.grip{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--ink-2);touch-action:none;cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.grip:disabled{opacity:.4;cursor:default}
.del{flex:none;display:grid;place-items:center;width:36px;height:44px;border:0;background:none;color:var(--ink-2)}
.del:disabled{opacity:.25}
.del:active{color:var(--danger)}
.inline-form{display:flex;gap:8px;margin:0 0 8px}
.inline-form .field{flex:1;min-width:0}
.ghost{min-height:42px;padding:0 14px;border:1.5px solid var(--ink-2);border-radius:10px;background:none;font-weight:600;font-size:14px;transition:transform 160ms var(--ease-out)}
.ghost:active{transform:scale(.97)}
.ghost.warn{border-color:var(--danger);color:var(--danger)}
.person{display:flex;align-items:center;gap:10px;min-height:40px;border-top:1px solid var(--line)}
.person .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.person .tag{font-size:12px;color:var(--ink-2)}
.acc-person{border-top:1px solid var(--line);padding:2px 0 6px}
.acc-lists{display:grid;gap:2px;padding:0 0 0 4px}
.acc-row{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px}
.acc-row input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.photo-big{width:100%;margin:0 0 8px;justify-content:center}
.monthbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.monthbar h2{flex:1;text-align:center;font-size:17px;text-transform:none;letter-spacing:0;font-family:var(--f-display);font-stretch:75%;font-weight:800}
.catrow{display:grid;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.catrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.catrow .top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.catsum{font-variant-numeric:tabular-nums;white-space:nowrap}
.catbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.catbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.catrow .pct{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rc-line{display:grid;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.rc-top{display:flex;gap:6px;align-items:center}
.rc-n{flex:1;min-width:0;height:40px;font-size:15px}
.rc-c{flex:none;width:96px;height:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.rc-cat{height:38px;font-size:14px}
.rc-sum{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.rc-sum.warn{color:var(--warn)}
.caution{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.acct{display:grid;gap:2px;padding:4px 0 8px}
.acct b{font-weight:600;overflow-wrap:anywhere}
.acct span{font-size:12.5px;color:var(--ink-2)}

/* Eingabe und Leiste unten */
.composer{padding:6px 0 0;border-top:1px solid var(--line);background:var(--bg)}
.hint{margin:0 0 5px;min-height:20px;font-size:12.5px;line-height:20px;color:var(--ink-2)}
.hint.flash{color:var(--ink);font-weight:600}
.hint-cat{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
#addForm{display:flex;gap:8px;align-items:flex-end}
#newItem{flex:1;min-width:0;min-height:44px;max-height:120px;resize:none;padding:10px 12px;border-radius:10px;border:1.5px solid var(--rail);background:var(--surface);font-size:16px;line-height:1.3;display:block}
#newItem:disabled{opacity:.6}
.ibtn,.add{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;transition:transform 160ms var(--ease-out)}
.ibtn{border:1.5px solid var(--rail);background:var(--surface);color:var(--ink)}
.add{background:var(--accent);color:var(--on-accent)}
.ibtn:active,.add:active{transform:scale(.95)}
.add:disabled,.ibtn:disabled{opacity:.5}
.nav{margin:10px auto calc(14px + env(safe-area-inset-bottom,0px));width:100%;max-width:420px;border-radius:999px;padding:5px;background:var(--nav);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 10px 26px rgba(40,45,15,.35),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.07)}
.navin{position:relative;display:flex}
.slot{position:absolute;top:0;left:0;width:20%;height:100%;display:grid;place-items:center;pointer-events:none;transition:transform 340ms var(--ease-out)}
.sunc{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF6BE 0%,#FFD23F 42%,#F59E0B 80%,#E0701A 100%);box-shadow:0 0 14px 2px rgba(255,190,50,.5)}
.nb{position:relative;z-index:1;flex:1;height:48px;display:grid;place-items:center;border:0;background:none;color:var(--nav-ink);transition:color 220ms ease}
.nb[aria-current="true"]{color:#1f2410}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform 140ms ease-out}
.nb:active svg{transform:scale(.85)}

/* Blatt von unten */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fadeIn 180ms ease-out both}
.sheet{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0;animation:rise 260ms var(--ease-drawer) both;
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.overlay.out{animation:fadeOut 150ms ease-out both}
.overlay.out .sheet{animation:sink 160ms ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes sink{to{transform:translateY(100%)}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;min-width:0;overflow-wrap:anywhere;font-size:18px;text-transform:none;letter-spacing:0}
.close{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:none;transition:transform 160ms var(--ease-out)}
.close:active{transform:scale(.92)}
.sheet-sub{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.sheet-body{overflow-y:auto;min-height:0;display:grid;gap:8px}
.cat-list{list-style:none;margin:0 0 4px;padding:0}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px}
.cat-btn:active{background:var(--line)}
.cat-btn span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cat-btn[aria-current="true"]{font-weight:700}
.danger{min-height:44px;border:0;border-top:1px solid var(--line);background:none;color:var(--danger);font-weight:600;text-align:left;width:100%}
.sheet-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border:1.5px solid var(--ink-2);border-radius:10px;background:none;font-weight:600;transition:transform 160ms var(--ease-out)}
.sheet-btn:active{transform:scale(.98)}
.sheet-btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.sheet-btn:disabled{opacity:.45}
.tpls{display:grid;gap:6px;margin:0 0 6px}
.tpl-btn{display:flex;flex-direction:column;align-items:flex-start;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:none;text-align:left;transition:transform 160ms var(--ease-out)}
.tpl-btn:active{transform:scale(.98)}
.tpl-btn b{font-weight:600}
.tpl-btn span{font-size:12.5px;color:var(--ink-2)}
.tpl-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.field-l{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.field-l .field{color:var(--ink);font-size:16px}
.amount{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:28px;height:54px}
.checks{display:grid;gap:2px}
.checks label{display:flex;align-items:center;gap:10px;min-height:40px;border-top:1px solid var(--line);font-weight:500}
.checks input{width:18px;height:18px;accent-color:var(--ink)}
textarea.imp{width:100%;min-height:130px;max-height:260px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--rail);background:var(--bg);font-size:16px;line-height:1.35;resize:vertical}
.prev{display:grid;gap:8px;max-height:36vh;overflow-y:auto}
.grp{padding:6px 0;border-top:1px solid var(--line)}
.grp-h{display:flex;align-items:center;gap:8px}
.grp-h b{flex:1;font-size:14px;font-weight:600}
.grp-h span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grp p{margin:3px 0 0;font-size:14px;color:var(--ink-2)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}

<div class="auth" id="auth" hidden>

    <form id="authForm" novalidate>

      <label class="sr" for="authPw">Passwort</label>
      <input class="field" id="authPw" type="password" autocomplete="current-password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" required>

function norm(s){

var KWC = {};
function kwFor(tplId){
  if(KWC[tplId]) return KWC[tplId];
  var out = {}, src = (TPLS[tplId] && TPLS[tplId].kw) || {};
  Object.keys(src).forEach(function(id){
    out[id] = src[id].split(',').map(function(s){return s.trim();}).filter(Boolean).map(function(s){
      return s.charAt(0)==='=' ? {s:norm(s.slice(1)), exact:true} : {s:norm(s), exact:false};
    });
  });
  KWC[tplId] = out;
  return out;
}

function fallbackId(stations){

}

  var st = TPLS[tplId] ? TPLS[tplId].stations : [];

  return false;
}

/* stations: die Stationen der Liste in ihrer Reihenfolge. Bei gleich langem Treffer gewinnt die frühere Station. */
function classify(name, learned, tplId, stations){
  var n = norm(name);
  var ids = stations.map(function(s){return s.id;});
  if(learned && learned[n] && ids.indexOf(learned[n]) >= 0) return learned[n];
  var tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  var kw = kwFor(tplId);
  var best = null, bestLen = 0;
  for(var ci=0; ci<stations.length; ci++){
    var st = stations[ci], list = kw[st.id] || [];
    if(!inTpl(tplId, st.id)){
      /* Eigene Stationen: Wörter aus dem Stationsnamen zählen als Schlüsselwörter. */
      list = norm(st.name).split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 4; }).map(function(w){ return {s:w, exact:false}; });
    }
    for(var ki=0; ki<list.length; ki++){
      var k = list[ki];
      var hit = k.exact ? tokens.indexOf(k.s) >= 0 : n.indexOf(k.s) >= 0;
      if(hit && k.s.length > bestLen){ best = st.id; bestLen = k.s.length; }
    }
  }
  return best || fallbackId(stations);
}

function parseReceipt(text){
  var rows = String(text || '').split(/\n/).map(function(s){ return s.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  var out = {date: null, total: null, items: []}, pending = '';
  var PRICE = /(-?\d{1,4}[.,]\d{2})\s*(?:€|EUR|[A-Za-z*]{1,2})?\s*$/i;
  var SKIP = /(\bbar\b|gegeben|rück|rueck|zurück|\bec\b|karte|visa|master|mwst|\bust\b|netto|brutto|steuer|%|kassen|beleg|datum|\buhr\b|filiale|\btel\b)/i;
  rows.forEach(function(r){
    var dm = r.match(/(\d{2})\.(\d{2})\.(\d{4}|\d{2})/);
    if(dm){
      if(!out.date) out.date = (dm[3].length === 2 ? '20' + dm[3] : dm[3]) + '-' + dm[2] + '-' + dm[1];
      if(!/[A-Za-z]/.test(r)) return;
    }
    var pm = r.match(PRICE);
    if(!pm){
      if(/[A-Za-zÄÖÜäöüß]{3,}/.test(r) && !SKIP.test(r)) pending = r;
      return;
    }
    var cents = toCents(pm[1]);
    if(!cents) return;
    if(/(summe|gesamt|total|zu zahlen|betrag)/i.test(r)){ out.total = Math.abs(cents); pending = ''; return; }
    var name = r.slice(0, r.length - pm[0].length).replace(/\s+/g, ' ').trim()
      .replace(/^\d+\s*[xX×]\s*\d+[.,]\d{2}\s*/, '')
      .replace(/^\d+\s*[xX×]\s*/, '')
      .replace(/\s+\d+\s*[xX×]\s*\d+[.,]\d{2}\s*$/, '')
      .replace(/\d+[.,]\d{2}\s*$/, '')
      .replace(/[\s.:*-]+$/, '').trim();
    if(!name && pending) name = pending;
    pending = '';
    if(!name || SKIP.test(name)) return;
    out.items.push({n: name, c: cents});
  });

}

    paid[e.payer] = (paid[e.payer] || 0) + e.cents;
    var n = e.parts.length;
    if(!n) return;
    var base = Math.floor(e.cents / n), rem = e.cents - base * n;
    e.parts.forEach(function(p, i){ owed[p] = (owed[p] || 0) + base + (i < rem ? 1 : 0); });
  });
  var names = {};
  people(l).concat(Object.keys(paid), Object.keys(owed)).forEach(function(p){ names[p] = 1; });
  Object.keys(names).forEach(function(p){ bal[p] = (paid[p] || 0) - (owed[p] || 0); });
  var debtors = [], creditors = [];
  Object.keys(bal).forEach(function(p){
    if(bal[p] < 0) debtors.push({p: p, c: -bal[p]});
    else if(bal[p] > 0) creditors.push({p: p, c: bal[p]});
  });
  debtors.sort(function(a,b){ return b.c - a.c; });
  creditors.sort(function(a,b){ return b.c - a.c; });
  var lines = [], i = 0, j = 0;
  while(i < debtors.length && j < creditors.length){
    var x = Math.min(debtors[i].c, creditors[j].c);
    lines.push({from: debtors[i].p, to: creditors[j].p, cents: x});
    debtors[i].c -= x; creditors[j].c -= x;
    if(debtors[i].c === 0) i++;
    if(creditors[j].c === 0) j++;
  }
  return {total: total, bal: bal, lines: lines, ex: ex};
}

/* ---------- Speicher (Supabase) ---------- */
function onWriteError(){ flashText('Nicht gespeichert. Prüft die Verbindung.'); scheduleReload(0); }
function upsertItem(it){
  if(!it) return;
  var i = state.items.findIndex(function(x){ return x.id === it.id; });
  if(i < 0) state.items.push(it); else state.items[i] = it;
}
async function loadAll(){
  if(!sb || !state.authed) return;
  try{
    var r = await Promise.all([
      sb.from('lists').select('*').order('created_at'),
      sb.from('list_members').select('list_id,email'),
      sb.from('items').select('*').order('created_at').range(0, 4999),
      sb.from('expenses').select('*').order('created_at').range(0, 4999)
    ]);
    for(var k = 0; k < r.length; k++){ if(r[k].error) throw r[k].error; }
    var mem = {};
    r[1].data.forEach(function(m){ (mem[m.list_id] = mem[m.list_id] || []).push(m.email); });
    state.lists = r[0].data.map(function(d){ return normList(d, mem[d.id]); }).sort(sortLists);
    state.items = r[2].data.map(function(d){ return normItem(d.id, d); }).filter(Boolean);
    state.expenses = r[3].data.map(normExp);
    state.loaded = true;
    state.mode = 'live';
    ensureCurrent();
    render();
  }catch(e){
    state.mode = 'lost';
    render();
  }
}
function scheduleReload(ms){
  clearTimeout(reloadT);
  reloadT = setTimeout(loadAll, ms === undefined ? 250 : ms);
}
function onItemChange(p){
  if(p.eventType === 'DELETE'){
    var id = p.old && p.old.id;
    state.items = state.items.filter(function(i){ return i.id !== id; });
    render();
  } else {
    upsertItem(normItem(p.new.id, p.new));
    render();
  }
}
function subscribe(){
  if(!sb) return;
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  chan = sb.channel('manjo')
    .on('postgres_changes', {event:'*', schema:'public', table:'items'}, onItemChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'lists'}, function(){ scheduleReload(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'list_members'}, function(){ scheduleReload(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'expenses'}, function(){ scheduleReload(); })
    .subscribe(function(status){
      if(status === 'SUBSCRIBED'){ state.mode = 'live'; renderHeader(); scheduleReload(0); }
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){ state.mode = 'lost'; renderHeader(); }
    });
}
var store = {
  addItem: function(item){
    return sb.from('items').insert({list_id: item.list, name: item.name, cat: item.cat, done: false}).select().single().then(function(r){
      if(r.error) throw r.error;
      upsertItem(normItem(r.data.id, r.data));
      render();
    }).catch(onWriteError);
  },
  updateItem: function(id, patch){
    var it = state.items.find(function(i){ return i.id === id; });
    if(it) Object.assign(it, patch);
    render();
    return sb.from('items').update(patch).eq('id', id).then(function(r){ if(r.error) onWriteError(); });
  },
  removeItems: function(ids){
    if(!ids.length) return;
    state.items = state.items.filter(function(i){ return ids.indexOf(i.id) < 0; });
    render();
    return sb.from('items').delete().in('id', ids).then(function(r){ if(r.error) onWriteError(); });
  },
  patchList: function(id, patch, quiet){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l) return;
    var p = JSON.parse(JSON.stringify(patch)), dbp = {};
    Object.assign(l, p);
    ['name', 'stations', 'learned'].forEach(function(k){ if(k in p) dbp[k] = p[k]; });
    if(Object.keys(dbp).length) sb.from('lists').update(dbp).eq('id', id).then(function(r){ if(r.error) onWriteError(); });
    if(quiet) renderHeader(); else render();
  },
  createList: function(name, tpl){
    return sb.from('lists').insert(newListObj(name, tpl)).select().single().then(function(r){
      if(r.error) throw r.error;
      var l = normList(r.data, []);
      state.lists.push(l);
      state.lists.sort(sortLists);
      return l.id;
    });
  },
  deleteList: function(id){
    state.items = state.items.filter(function(i){ return i.list !== id; });
    state.expenses = state.expenses.filter(function(e){ return e.list !== id; });
    state.lists = state.lists.filter(function(l){ return l.id !== id; });
    return sb.from('lists').delete().eq('id', id).then(function(r){ if(r.error) onWriteError(); });
  },
  addMember: function(id, email){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l || l.members.indexOf(email) >= 0) return;
    l.members.push(email);
    render();
    return sb.from('list_members').insert({list_id: id, email: email}).then(function(r){ if(r.error) onWriteError(); });
  },
  removeMember: function(id, email){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l) return;
    l.members = l.members.filter(function(m){ return m !== email; });
    render();
    return sb.from('list_members').delete().eq('list_id', id).eq('email', email).then(function(r){ if(r.error) onWriteError(); });
  },
  addExpense: function(lid, cents, desc, payer, parts, extra){
    var row = {list_id: lid, amount_cents: cents, description: desc, payer_email: payer, participants: parts, lines: (extra && extra.lines) || []};
    if(extra && extra.spent_on) row.spent_on = extra.spent_on;
    return sb.from('expenses').insert(row).then(function(r){
      if(r.error) throw r.error;
      scheduleReload(0);
    }).catch(onWriteError);
  },
  removeExpense: function(id){
    state.expenses = state.expenses.filter(function(e){ return e.id !== id; });
    render();
    return sb.from('expenses').delete().eq('id', id).then(function(r){ if(r.error) onWriteError(); });
  }
};

/* ---------- Aktionen ---------- */
function addItem(l, raw, batch){
  var name = cap(raw.trim().replace(/\s+/g, ' '));
  if(!name) return null;
  var key = norm(name);
  if(batch){ if(batch[key]) return {status:'dup', name:name}; batch[key] = 1; }
  var dup = listItems(l).find(function(i){ return norm(i.name) === key; });
  if(dup){
    if(dup.done){ store.updateItem(dup.id, {done:false}); return {status:'back', name:dup.name}; }
    return {status:'dup', name:dup.name};
  }
  var c = clsf(l, name);
  store.addItem({name: name, cat: c, done: false, list: l.id});
  return {status:'added', name: name, cat: c};
}
function addFromText(text){
  var l = cur();
  if(!l) return;
  var parts = text.split(/[,;\n]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  var batch = {};
  var res = parts.map(function(p){ return addItem(l, p, batch); }).filter(Boolean);
  if(!res.length) return;
  if(res.length === 1){
    var r = res[0];
    if(r.status === 'added') flash(esc(r.name) + ' → ' + catHTML(l, r.cat));
    else if(r.status === 'back') flashText(r.name + ' ist wieder auf der Liste.');
    else flashText(r.name + ' steht schon auf der Liste.');
  } else {
    flashText(res.filter(function(r){ return r.status !== 'dup'; }).length + ' Artikel hinzugefügt.');
  }
}
function moveStation(sid, to){
  var l = cur();
  if(!l) return false;
  var st = l.stations.slice(), from = stationIds(l).indexOf(sid);
  if(from < 0 || to < 0 || to >= st.length || to === from) return false;
  var m = st.splice(from, 1)[0];
  st.splice(to, 0, m);
  store.patchList(l.id, {stations: st});
  return true;
}

/* ---------- Ziehen der Stationen ---------- */
function startDrag(e, grip){
  var row = grip.closest('.ord');
  if(!row) return;
  var list = row.parentNode;
  var rows = Array.prototype.slice.call(list.children);
  var i = rows.indexOf(row);
  var rects = rows.map(function(r){ return {top: r.offsetTop, h: r.offsetHeight}; });
  var gap = rects.length > 1 ? rects[1].top - rects[0].top - rects[0].h : 0;
  drag = {pid: e.pointerId, row: row, rows: rows, rects: rects, gap: gap, i: i, j: i, cat: row.dataset.cat,
          startY: e.clientY, startScroll: main.scrollTop, y: e.clientY, raf: 0, dirty: false, ended: false};
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  row.classList.add('lift');
  rows.forEach(function(r, k){ if(k !== i) r.classList.add('shift'); });
  main.classList.add('dragging');
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
  tick();
}
function applyDrag(){
  var d = drag;
  if(!d || d.ended) return;
  var rects = d.rects, r = rects[d.i], last = rects[rects.length - 1];
  var dy = (d.y - d.startY) + (main.scrollTop - d.startScroll);
  dy = Math.max(-r.top, Math.min(last.top + last.h - (r.top + r.h), dy));
  d.row.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
  var j = dragTarget(rects, d.i, dy);
  if(j !== d.j){
    d.j = j;
    d.rows.forEach(function(row, k){
      if(k === d.i) return;
      var s = dragShift(rects, d.i, j, k, d.gap);
      row.style.transform = s ? 'translateY(' + s + 'px)' : '';
    });
    var arr = d.rows.slice();
    var moved = arr.splice(d.i, 1)[0];
    arr.splice(j, 0, moved);
    arr.forEach(function(row, idx){ row.querySelector('.badge').textContent = idx + 1; });
  }
}
function tick(){
  var d = drag;
  if(!d || d.ended) return;
  var mr = main.getBoundingClientRect(), edge = 64, v = 0;
  if(d.y < mr.top + edge) v = -Math.ceil((mr.top + edge - d.y) / 6);
  else if(d.y > mr.bottom - edge) v = Math.ceil((d.y - (mr.bottom - edge)) / 6);
  v = Math.max(-14, Math.min(14, v));
  if(v) main.scrollTop += v;
  applyDrag();
  d.raf = requestAnimationFrame(tick);
}
function onDragMove(e){
  if(!drag || e.pointerId !== drag.pid) return;
  drag.y = e.clientY;
  applyDrag();
}
function onDragEnd(e){
  var d = drag;
  if(!d || d.ended || e.pointerId !== d.pid) return;
  d.ended = true;
  cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  var final = dragFinal(d.rects, d.i, d.j);
  d.row.classList.remove('lift');
  d.row.classList.add('drop');
  d.row.style.transform = 'translateY(' + final + 'px)';
  setTimeout(function(){
    var cat = d.cat, j = d.j, l = cur();
    drag = null;
    main.classList.remove('dragging');
    if(moveStation(cat, j) && l) announce(stationName(l, cat) + ', Position ' + (j + 1) + ' von ' + l.stations.length);
    focusFn = function(){ return main.querySelector('.grip[data-cat="' + sel(cat) + '"]'); };
    render();
  }, RM ? 0 : 200);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest && e.target.closest('.grip');
  if(!g || g.disabled || drag || !state.authed) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  startDrag(e, g);
});

document.addEventListener('click', function(e){
  if(e.target === overlay){ closeSheet(); return; }
  var b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  var act = b.dataset.act, id = b.dataset.id, l = cur();
  var it = id ? state.items.find(function(i){ return i.id === id; }) : null;
  if(act === 'nav'){
    var v = b.dataset.view;
    if(v === 'markets'){
      if(state.sheet && state.sheet.type === 'markets'){ closeSheet(); }
      else openSheet({type:'markets'}, '[data-act="nav"][data-view="markets"]');
      return;
    }
    if(state.sheet){ state.sheet = null; overlay.hidden = true; sheetHtml = ''; }
    setView(v);
  } else if(act === 'pick-list'){
    var fromSheet = b.dataset.from === 'sheet';
    switchList(id);
    if(fromSheet){ state.view = 'list'; closeSheet(); }
    else { render(); }
  } else if(act === 'new-list-open'){
    openSheet({type:'new', tpl:'supermarkt', name:TPLS.supermarkt.name}, state.sheet ? openerSel : null, '#newListName');
  } else if(act === 'tpl'){
    var s = state.sheet;
    if(s && s.type === 'new'){
      s.tpl = b.dataset.tpl;
      s.name = s.tpl === 'eigen' ? 'Neue Liste' : TPLS[s.tpl].name;
      sheetHtml = '';
      renderSheet();
    }
  } else if(act === 'import'){
    openSheet({type:'import', text: input.value}, '[data-act="import"]', '#impText');
  } else if(act === 'imp-add' && l){
    var ta = $('#impText');
    if(!ta) return;
    var added = 0, batch = {};
    ta.value.split(/[\n,;]+/).map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(p){
      var r = addItem(l, p, batch);
      if(r && r.status === 'added') added++;
    });
    closeSheet();
    flashText(added + (added === 1 ? ' Artikel' : ' Artikel') + ' sortiert eingefügt.');
    input.value = ''; autosize();
  } else if(act === 'exp-open' && l){
    openSheet({type:'exp'}, '[data-act="exp-open"]', '#expAmount');
  } else if(act === 'exp-del' && l){
    if(state.confirmExp !== id){
      state.confirmExp = id;
      clearTimeout(delT);
      delT = setTimeout(function(){ state.confirmExp = null; render(); }, 3000);
      render();
    } else {
      clearTimeout(delT);
      state.confirmExp = null;
      store.removeExpense(id);
    }
  } else if(act === 'toggle' && it){
    focusFn = function(){ return main.querySelector('[data-act="toggle"][data-id="' + sel(id) + '"]'); };
    if(pendingDone[id]){
      clearTimeout(pendingDone[id]);
      delete pendingDone[id];
      render();
    } else if(!it.done && !RM){
      pendingDone[id] = setTimeout(function(){
        delete pendingDone[id];
        store.updateItem(id, {done: true});
      }, 320);
      render();
    } else {
      store.updateItem(id, {done: !it.done});
    }
  } else if(act === 'more' && it){
    openSheet({type:'cat', id: id}, '[data-act="more"][data-id="' + sel(id) + '"]');
  } else if(act === 'close'){
    closeSheet();
  } else if(act === 'cat'){
    var cur2 = state.sheet && state.items.find(function(i){ return i.id === state.sheet.id; });
    var c = b.dataset.cat;
    if(cur2 && l && c !== effCat(l, cur2.cat)){
      store.updateItem(cur2.id, {cat: c});
      var learned = Object.assign({}, l.learned);
      learned[norm(cur2.name)] = c;
      var keys = Object.keys(learned);
      if(keys.length > 300){ keys.slice(0, keys.length - 300).forEach(function(k){ delete learned[k]; }); }
      store.patchList(l.id, {learned: learned}, true);
      flash(esc(cur2.name) + ' → ' + catHTML(l, c));
    }
    closeSheet();
  } else if(act === 'delete'){
    if(state.sheet) store.removeItems([state.sheet.id]);
    closeSheet();
  } else if(act === 'reset-order' && l && canManage(l)){
    store.patchList(l.id, {stations: TPLS[l.tpl].stations.map(function(s){ return {id:s.id, name:s.name}; })});
  } else if(act === 'del-station' && l && canManage(l)){
    var sid = b.dataset.cat;
    if(sid === 'sonst') return;
    store.patchList(l.id, {stations: l.stations.filter(function(s){ return s.id !== sid; })});
    announce('Station entfernt.');
  } else if(act === 'rm-member' && l && canManage(l)){
    store.removeMember(l.id, b.dataset.email);
  } else if(act === 'del-list' && l && canManage(l)){
    if(!state.confirmDel){
      state.confirmDel = true;
      clearTimeout(delT);
      delT = setTimeout(function(){ state.confirmDel = false; if(state.view === 'settings') render(); }, 3500);
      render();
    } else {
      clearTimeout(delT);
      state.confirmDel = false;
      store.deleteList(l.id);
      ensureCurrent();
      if(state.listId) lsSet(LS_CUR, state.listId);
      state.view = 'list';
      flashText('Liste gelöscht.');
      render();
    }
  } else if(act === 'sample'){
    addFromText(b.dataset.text);
  } else if(act === 'clear-done' && l){
    if(!state.confirmClear){
      state.confirmClear = true;
      clearTimeout(clearT);
      clearT = setTimeout(function(){ state.confirmClear = false; render(); }, 3000);
      render();
    } else {
      clearTimeout(clearT);
      state.confirmClear = false;
      store.removeItems(listItems(l).filter(function(i){ return i.done; }).map(function(i){ return i.id; }));
      render();
    }
  } else if(act === 'bill-tab'){
    state.billTab = b.dataset.tab;
    main.scrollTop = 0;
    render();
  } else if(act === 'month'){
    state.month = shiftMonth(state.month, +b.dataset.d);
    render();
  } else if(act === 'photo'){
    var fi = document.getElementById('rcFile');
    if(fi) fi.click();
  } else if(act === 'rc-add' && l){
    readRcp();
    state.rcp.lines.push({n: '', c: 0, cat: stationIds(l)[0] || 'sonst'});
    sheetHtml = ''; renderSheet();
  } else if(act === 'rc-del'){
    readRcp();
    state.rcp.lines.splice(+b.dataset.i, 1);
    sheetHtml = ''; renderSheet();
  } else if(act === 'signout'){
    sb.auth.signOut();
  }
});

document.addEventListener('change', function(e){
  var t = e.target, l = cur();
  if(t.id === 'rcFile'){ var f0 = t.files && t.files[0]; t.value = ''; if(f0) handleFile(f0); return; }
  if(t.dataset && t.dataset.list){
    var ll = state.lists.filter(function(x){ return x.id === t.dataset.list; })[0];
    if(!ll || ll.owner !== state.me.id) return;
    if(t.checked) store.addMember(ll.id, t.dataset.email); else store.removeMember(ll.id, t.dataset.email);
    return;
  }
  if(!l || !canManage(l)) return;
  if(t.id === 'listNameInput'){
    var v = t.value.trim().replace(/\s+/g, ' ');
    if(!v){ t.value = l.name; return; }
    if(v !== l.name) store.patchList(l.id, {name: v}, true);
  } else if(t.classList && t.classList.contains('station-in')){
    var sid = t.dataset.cat, nv = t.value.trim().replace(/\s+/g, ' ');
    var old = l.stations.filter(function(s){ return s.id === sid; })[0];
    if(!old) return;
    if(!nv){ t.value = old.name; return; }
    if(nv !== old.name) store.patchList(l.id, {stations: l.stations.map(function(s){ return s.id === sid ? {id: s.id, name: nv} : s; })}, true);
  }
});

input.addEventListener('input', function(){
  if(flashT){ clearTimeout(flashT); flashT = null; hint.classList.remove('flash'); }
  autosize();
  updateHint();
});
input.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id === 'newListName' && state.sheet && state.sheet.type === 'new'){ state.sheet.name = t.value; }
  else if(t.id === 'impText' && state.sheet && state.sheet.type === 'import'){ state.sheet.text = t.value; updateImport(); }
});
main.addEventListener('focusout', function(){
  if(!pendingRender) return;
  setTimeout(function(){
    var a = document.activeElement;
    if(pendingRender && !(a && main.contains(a) && a.tagName === 'INPUT')){ pendingRender = false; render(); }
  }, 0);
});

document.addEventListener('keydown', function(e){
  if(!overlay.hidden){
    if(e.key === 'Escape'){ closeSheet(); return; }
    if(e.key === 'Tab'){
      var f = Array.prototype.slice.call(overlay.querySelectorAll('button:not(:disabled), input, textarea, select'));
      if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(e.key === 'Enter' && e.target.matches && e.target.matches('.station-in, #listNameInput')){ e.preventDefault(); e.target.blur(); return; }
  var g = e.target.closest && e.target.closest('.grip');
  if(g && !g.disabled && !drag && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    var l = cur();
    if(!l) return;
    var cat = g.dataset.cat, from = stationIds(l).indexOf(cat);
    if(moveStation(cat, from + (e.key === 'ArrowUp' ? -1 : 1))){
      var l2 = cur(), to = stationIds(l2).indexOf(cat);
      announce(stationName(l2, cat) + ', Position ' + (to + 1) + ' von ' + l2.stations.length);
      focusFn = function(){ return main.querySelector('.grip[data-cat="' + sel(cat) + '"]'); };
      render();
    }
  }
});

document.addEventListener('submit', function(e){
  var f = e.target;
  if(main.contains(f) && document.activeElement && main.contains(document.activeElement) && document.activeElement.blur){ document.activeElement.blur(); }
  if(f.id === 'addForm'){
    e.preventDefault();
    var v = input.value;
    if(!v.trim() || !state.authed) return;
    input.value = ''; autosize();
    addFromText(v);
    input.focus();
  } else if(f.id === 'newListForm'){
    e.preventDefault();
    var s = state.sheet;
    if(!s || s.type !== 'new' || !state.authed) return;
    var name = (s.name || '').trim().replace(/\s+/g, ' ') || (s.tpl === 'eigen' ? 'Neue Liste' : TPLS[s.tpl].name);
    store.createList(name, s.tpl).then(function(id){
      switchList(id);
      state.view = 'list';
      openerSel = null;
      render();
      closeSheet();
      flashText('Liste „' + name + '“ angelegt.');
    }).catch(onWriteError);
  } else if(f.id === 'expForm'){
    e.preventDefault();
    var lx = cur();
    if(!lx) return;
    var cents = parseAmount($('#expAmount').value);
    if(!cents){ flashText('Bitte einen Betrag eingeben, zum Beispiel 12,50.'); return; }
    var parts = Array.prototype.map.call(overlay.querySelectorAll('input[name="part"]:checked'), function(x){ return x.value; });
    if(!parts.length){ flashText('Mindestens eine Person anhaken.'); return; }
    var payer = $('#expPayer').value;
    if(parts.indexOf(payer) < 0 && !parts.length){ return; }
    store.addExpense(lx.id, cents, $('#expDesc').value.trim(), payer, parts);
    closeSheet();
    flashText(money(cents) + ' eingetragen.');
  } else if(f.id === 'stationForm'){
    e.preventDefault();
    var lst = cur(), inp = $('#newStation');
    if(!lst || !inp || !canManage(lst)) return;
    var nm = inp.value.trim().replace(/\s+/g, ' ');
    if(!nm) return;
    var st = lst.stations.slice(), at = stationIds(lst).indexOf('sonst');
    var ns = {id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), name: nm};
    if(at >= 0 && at === st.length - 1) st.splice(at, 0, ns); else st.push(ns);
    focusFn = function(){ return $('#newStation'); };
    store.patchList(lst.id, {stations: st});
  } else if(f.id === 'memberForm'){
    e.preventDefault();
    var l0 = cur(), mi = $('#memberEmail');
    if(!l0 || !mi || !canManage(l0)) return;
    var em = mi.value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ flashText('Das ist keine gültige E-Mail-Adresse.'); return; }
    if(people(l0).indexOf(em) >= 0){ flashText('Diese Person ist schon dabei.'); return; }
    focusFn = function(){ return $('#memberEmail'); };
    store.addMember(l0.id, em);
  } else if(f.id === 'rcForm'){
    e.preventDefault();
    saveRcp();
  } else if(f.id === 'accessForm'){
    e.preventDefault();
    var ae = $('#accessEmail');
    var aem = ae ? ae.value.trim().toLowerCase() : '';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(aem)){ flashText('Das ist keine gültige E-Mail-Adresse.'); return; }
    if(ae) ae.blur();
    if(state.accessExtra.indexOf(aem) < 0 && aem !== state.me.email) state.accessExtra.push(aem);
    focusFn = function(){ return $('#accessEmail'); };
    render();
  } else if(f.id === 'authForm'){
    e.preventDefault();
    doAuth();
  }
});

/* ---------- Anmeldung und Start ---------- */
var CFG = window.EINKAUF_CONFIG || {};
function showAuth(on){
  $('#auth').hidden = !on;
  $('#app').hidden = on;
}
function authMsg(t, err){
  var m = $('#authMsg');
  m.textContent = t || '';
  m.className = 'msg' + (err ? ' err' : '');
}
function setSignup(on){
  signup = on;
  $('#authSubmit').textContent = on ? 'Konto erstellen' : 'Anmelden';
  $('#authToggle').textContent = on ? 'Schon ein Konto? Anmelden' : 'Neu hier? Konto erstellen';
  $('#authPw').autocomplete = on ? 'new-password' : 'current-password';
  authMsg('');
}
async function doAuth(){
  if(!sb) return;
  var email = $('#authEmail').value.trim().toLowerCase(), pw = $('#authPw').value;
  if(!email || !pw){ authMsg('Bitte E-Mail und Passwort eingeben.', true); return; }
  if(signup && pw.length < 8){ authMsg('Das Passwort braucht mindestens 8 Zeichen.', true); return; }
  authMsg('Einen Moment …');
  $('#authSubmit').disabled = true;
  try{
    if(signup){
      var r = await sb.auth.signUp({email: email, password: pw});
      if(r.error) authMsg(/registered/i.test(r.error.message) ? 'Zu dieser Adresse gibt es schon ein Konto. Melde dich an.' : 'Das hat nicht geklappt: ' + r.error.message, true);
      else if(!r.data.session) authMsg('Fast fertig: Wir haben dir eine Bestätigungsmail geschickt.');
    } else {
      var r2 = await sb.auth.signInWithPassword({email: email, password: pw});
      if(r2.error) authMsg(/confirm/i.test(r2.error.message) ? 'Bitte zuerst die Adresse per Mail bestätigen.' : 'E-Mail oder Passwort stimmt nicht.', true);
    }
  }catch(e){ authMsg('Keine Verbindung. Versuch es gleich nochmal.', true); }
  $('#authSubmit').disabled = false;
}
function onSignedIn(session){
  if(state.authed) return;
  state.authed = true;
  state.me = {id: session.user.id, email: String(session.user.email || '').toLowerCase()};
  state.mode = 'loading';
  showAuth(false);
  render();
  loadAll();
  subscribe();
}
function onSignedOut(){
  state.authed = false;
  state.me = {id: null, email: ''};
  state.lists = []; state.items = []; state.expenses = []; state.listId = null; state.accessExtra = [];
  state.loaded = false; state.view = 'list'; state.sheet = null; state.mode = 'loading';
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  $('#authPw').value = '';
  showAuth(true);
  overlay.hidden = true;
}
$('#authToggle').addEventListener('click', function(){ setSignup(!signup); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && state.authed){
    if(state.mode === 'lost') subscribe();
    scheduleReload(0);
  }
});
window.addEventListener('online', function(){ if(state.authed){ subscribe(); scheduleReload(0); } });

(async function boot(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if(!CFG.url || !CFG.key || !window.supabase){
    showAuth(true);
    $('#authForm').hidden = true;
    $('#authToggle').hidden = true;
    $('#authLead').textContent = window.supabase ? 'Trage in config.js die URL und den Schlüssel deines Supabase-Projekts ein.' : 'Die Supabase-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung.';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false}});
  sb.auth.onAuthStateChange(function(ev, session){
    if(ev === 'SIGNED_OUT') onSignedOut();
    else if(session && !state.authed) onSignedIn(session);
  });
  var s = await sb.auth.getSession();
  if(s.data && s.data.session) onSignedIn(s.data.session); else showAuth(true);
})();

render();
})();
</script>
