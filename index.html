<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>manjo</title>
<meta name="theme-color" content="#edf1ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="manjo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte. Links läuft eine Routenlinie, an der die Stationen des Ladens
   als gelbe Gangschilder hängen und an der Kasse enden. Die Nummer ist die Position in eurer
   Laufreihenfolge. Das Gelb ist der einzige laute Moment, alles andere bleibt ruhig.
   Dichte: kleine Schrift, enge Zeilen, damit viel auf einen Bildschirm passt. */
:root{
  --bg:#edf1ef;
  --surface:#f8faf9;
  --ink:#13211d;
  --ink-2:#46564f;
  --line:#cfd9d4;
  --rail:#9fb1aa;
  --accent:#ffd23f;
  --on-accent:#13211d;
  --danger:#b3261e;
  --ok:#1f8a5b;
  --warn:#b26a00;
  --scrim:rgba(10,20,17,.5);
  --lift:0 12px 28px rgba(19,33,29,.22);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1815; --surface:#17231f; --ink:#eaf1ee; --ink-2:#9db0a9; --line:#2b3c36; --rail:#3f544d;
    --danger:#ff8f86; --ok:#4cd69a; --warn:#ffb74d; --scrim:rgba(0,0,0,.6); --lift:0 12px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1815; --surface:#17231f; --ink:#eaf1ee; --ink-2:#9db0a9; --line:#2b3c36; --rail:#3f544d;
  --danger:#ff8f86; --ok:#4cd69a; --warn:#ffb74d; --scrim:rgba(0,0,0,.6); --lift:0 12px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{text-wrap:pretty}

.app{
  height:100%;max-width:560px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
}

/* Kopf */
.top{padding-top:4px;display:grid;gap:2px}
.hrow{display:flex;align-items:center;gap:6px;min-height:44px}
.list-btn{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 6px 0 0;border:0;background:none;text-align:left;transition:transform 160ms var(--ease-out)}
.list-btn:active{transform:scale(.98)}
.list-btn .ln{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;letter-spacing:-.005em;line-height:1.1}
.list-btn svg{flex:none;color:var(--ink-2)}
.grow{flex:1}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync[data-s="live"] .dot{background:var(--ok)}
.sync[data-s="local"] .dot{background:var(--warn)}
.sync[data-s="lost"] .dot{background:var(--danger)}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--ink);transition:transform 160ms var(--ease-out),background-color 160ms ease}
.icon-btn:active{transform:scale(.92)}
.hrow h1{margin:0;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;line-height:1.1}
.hrow .sub{font-size:12px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{display:flex;align-items:center;gap:10px;padding-bottom:6px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease-out)}

/* Hauptbereich */
main{overflow-y:auto;overscroll-behavior:contain;padding:10px 0 18px;min-width:0}
main.vin{animation:enterIn 200ms var(--ease-out) both}
main.dragging,main.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 10px;padding:2px 10px;margin:0 0 10px;border:1px dashed var(--rail);border-radius:10px;font-size:13px;color:var(--ink-2)}
.note p{margin:5px 0}

.route{list-style:none;margin:0;padding:0}
.stop{position:relative;padding-left:40px;padding-bottom:12px}
.stop::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--rail)}
.badge{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 5px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.badge.sm{min-width:22px;height:18px;font-size:12.5px;border-radius:4px;padding:0 4px}
.stop .badge{position:absolute;left:0;top:0}
.stop-h{display:flex;align-items:center;gap:8px;min-height:22px}
h2{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;text-wrap:balance}
.count{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.end{position:relative;display:flex;align-items:center;min-height:22px;padding-left:40px;color:var(--ink-2)}
.end::before{content:"";position:absolute;left:13px;top:0;width:2px;height:5px;background:var(--rail)}
.end::after{content:"";position:absolute;left:7px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--rail);background:var(--bg)}
.end span{font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}

.items{list-style:none;margin:1px 0 0;padding:0}
.item{display:flex;align-items:stretch}
.item + .item{border-top:1px solid var(--line)}
.item.enter{animation:enterIn 240ms var(--ease-out) both}
@keyframes enterIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;padding:3px 0;border:0;background:none;text-align:left}
.box{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-2);transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
.box svg{opacity:0}
.row-main:active .box{transform:scale(.86)}
.row-main[aria-checked="true"] .box{background:var(--ink-2);border-color:var(--ink-2);color:var(--bg)}
.row-main[aria-checked="true"] .box svg{opacity:1}
.item.checking .box svg{animation:tick 220ms var(--ease-out) both}
@keyframes tick{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.name{min-width:0;overflow-wrap:anywhere;font-size:15.5px;font-weight:500;line-height:1.25;transition:color 160ms ease}
.done .name{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}
.more{flex:none;display:grid;place-items:center;width:40px;border:0;background:none;color:var(--ink-2)}
.more:active{color:var(--ink)}
button:disabled{cursor:default}
.row-main:disabled{opacity:.7}
@media (hover:hover) and (pointer:fine){
  .row-main:hover .box{border-color:var(--ink)}
  .more:hover,.icon-btn:hover{color:var(--ink)}
  .icon-btn:hover{background:var(--line)}
}

.cart{margin-top:2px;padding-top:8px;border-top:1px solid var(--line)}
.cart-h{display:flex;align-items:center;gap:8px}
.cart-h h2{color:var(--ink-2)}
.link{margin-left:auto;min-height:40px;padding:0 0 0 10px;border:0;background:none;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.allset{margin:0 0 10px;font-size:16px;font-weight:600}

.empty h2{font-size:22px;letter-spacing:.01em;text-transform:none;font-weight:800;margin-bottom:6px}
.empty p{margin:0 0 12px;max-width:40ch;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink-2);background:none;font-weight:600;transition:transform 160ms var(--ease-out)}
.chip:active{transform:scale(.97)}

/* Einstellungen */
.set{margin:0 0 20px}
.set h3{margin:0 0 6px;font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tip{margin:0 0 8px;max-width:48ch;font-size:13px;color:var(--ink-2)}
.field{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--rail);background:var(--surface);font-size:16px}
.order-list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px;position:relative}
.ord{position:relative;display:flex;align-items:center;gap:8px;min-height:50px;padding:3px 2px 3px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ord-text{flex:1;min-width:0;display:grid}
.station-in{width:100%;height:32px;padding:0 6px;margin-left:-6px;border:1.5px solid transparent;border-radius:8px;background:transparent;font-size:15px;font-weight:600;text-overflow:ellipsis}
.station-in:focus{border-color:var(--rail);background:var(--bg)}
.ord-ex{font-size:12px;color:var(--ink-2);line-height:1.2;margin-top:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord.empty .station-in{color:var(--ink-2);font-weight:500}
.ord.shift,.ord.drop{transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.ord.lift{z-index:3;transition:none;box-shadow:var(--lift);border-color:var(--ink-2)}
.ord.drop{z-index:3}
.grip{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--ink-2);touch-action:none;cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.grip:disabled{opacity:.4;cursor:default}
.del{flex:none;display:grid;place-items:center;width:36px;height:44px;border:0;background:none;color:var(--ink-2)}
.del:disabled{opacity:.25}
.del:active{color:var(--danger)}
.inline-form{display:flex;gap:8px;margin:0 0 8px}
.inline-form .field{flex:1;min-width:0}
.ghost{min-height:42px;padding:0 14px;border:1.5px solid var(--ink-2);border-radius:10px;background:none;font-weight:600;font-size:14px;transition:transform 160ms var(--ease-out)}
.ghost:active{transform:scale(.97)}
.ghost.warn{border-color:var(--danger);color:var(--danger)}
.radio{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0}
.radio input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink)}
.radio b{display:block;font-weight:600}
.radio span.d{display:block;font-size:12.5px;color:var(--ink-2)}
.person{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.person img{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line)}
.person .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.person .tag{font-size:12px;color:var(--ink-2)}
.person .del{height:40px}
.results{margin:0 0 8px;padding:0;list-style:none}
.results button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.results img{width:28px;height:28px;border-radius:50%;background:var(--line)}
.caution{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.acct{display:flex;align-items:center;gap:12px;padding:6px 0}
.acct img{flex:none;width:40px;height:40px;border-radius:50%;background:var(--line)}
.acct b{display:block;font-weight:600}
.acct span{font-size:12.5px;color:var(--ink-2)}

/* Eingabe */
.composer{padding:6px 0 10px;border-top:1px solid var(--line);background:var(--bg)}
.hint{margin:0 0 5px;min-height:20px;font-size:12.5px;line-height:20px;color:var(--ink-2)}
.hint.flash{color:var(--ink);font-weight:600}
.hint-cat{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
#addForm{display:flex;gap:8px}
#newItem{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--rail);background:var(--surface);font-size:16px}
#newItem:disabled{opacity:.6}
.add{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);transition:transform 160ms var(--ease-out)}
.add:active{transform:scale(.95)}
.add:disabled{opacity:.5}

/* Blatt von unten */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fadeIn 180ms ease-out both}
.sheet{
  width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;
  background:var(--surface);border-radius:16px 16px 0 0;animation:rise 260ms var(--ease-drawer) both;
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
}
.overlay.out{animation:fadeOut 150ms ease-out both}
.overlay.out .sheet{animation:sink 160ms ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes sink{to{transform:translateY(100%)}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;min-width:0;overflow-wrap:anywhere;font-size:18px;text-transform:none;letter-spacing:0}
.close{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:none;transition:transform 160ms var(--ease-out)}
.close:active{transform:scale(.92)}
.sheet-sub{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.sheet-body{overflow-y:auto;min-height:0}
.cat-list{list-style:none;margin:0 0 6px;padding:0}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px}
.cat-btn:active{background:var(--line)}
.cat-btn span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cat-btn[aria-current="true"]{font-weight:700}
.danger{min-height:44px;border:0;border-top:1px solid var(--line);background:none;color:var(--danger);font-weight:600;text-align:left;width:100%}
.sheet-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:6px;border:1.5px solid var(--ink-2);border-radius:10px;background:none;font-weight:600;transition:transform 160ms var(--ease-out)}
.sheet-btn:active{transform:scale(.98)}
.sheet-btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.tpls{display:grid;gap:6px;margin:0 0 10px}
.tpl-btn{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:none;text-align:left;transition:transform 160ms var(--ease-out)}
.tpl-btn:active{transform:scale(.98)}
.tpl-btn b{font-weight:600}
.tpl-btn span{font-size:12.5px;color:var(--ink-2)}
.tpl-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}

/* Anmeldung */
.auth{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.auth-card{width:100%;max-width:380px}
.auth h1{margin:0 0 6px;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:34px;line-height:1}
.auth p{margin:0 0 16px;color:var(--ink-2)}
.auth form{display:grid;gap:10px}
.auth .primary{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;transition:transform 160ms var(--ease-out)}
.auth .primary:active{transform:scale(.98)}
.auth .msg{min-height:20px;margin:0;font-size:13px;color:var(--ink-2)}
.auth .msg.err{color:var(--danger)}
.auth .alt{margin-top:4px;min-height:44px;border:0;background:none;font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}
</style>
</head>
<body>

<div class="app" hidden>
  <header class="top">
    <div class="hrow" id="hdrMain">
      <button class="list-btn" data-act="lists" aria-haspopup="dialog" aria-label="Liste wechseln">
        <span class="ln" id="listName">manjo</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="grow"></span>
      <span class="sync" id="sync" data-s="loading"><i class="dot"></i><span id="syncText">Verbinde</span></span>
      <button class="icon-btn" data-act="settings" aria-label="Einstellungen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="sum" id="sumRow"><span id="sumText">&nbsp;</span><div class="bar" aria-hidden="true"><i id="barFill"></i></div></div>
    <div class="hrow" id="hdrSet" hidden>
      <button class="icon-btn" data-act="back" aria-label="Zurück zur Liste">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1>Einstellungen</h1>
      <span class="grow"></span>
      <span class="sub" id="setSub"></span>
    </div>
  </header>

  <main id="main" aria-label="Inhalt"></main>

  <footer class="composer" id="composer">
    <p class="hint" id="hint" aria-live="polite"></p>
    <form id="addForm" autocomplete="off">
      <label class="sr" for="newItem">Artikel hinzufügen</label>
      <input id="newItem" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="120" placeholder="Artikel hinzufügen">
      <button class="add" type="submit" aria-label="Hinzufügen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>

function norm(s){
  return String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}

var KWC = {};
function kwFor(tplId){
  if(KWC[tplId]) return KWC[tplId];
  var out = {}, src = (TPLS[tplId] && TPLS[tplId].kw) || {};
  Object.keys(src).forEach(function(id){
    out[id] = src[id].split(',').map(function(s){return s.trim();}).filter(Boolean).map(function(s){
      return s.charAt(0)==='=' ? {s:norm(s.slice(1)), exact:true} : {s:norm(s), exact:false};
    });
  });
  KWC[tplId] = out;
  return out;
}

function fallbackId(stations){
  for(var i=0;i<stations.length;i++){ if(stations[i].id==='sonst') return 'sonst'; }
  return stations.length ? stations[stations.length-1].id : 'sonst';
}
function inTpl(tplId, sid){
  var st = TPLS[tplId] ? TPLS[tplId].stations : [];
  for(var i=0;i<st.length;i++){ if(st[i].id===sid) return true; }
  return false;
}

/* stations: die Stationen der Liste in ihrer Reihenfolge. Bei gleich langem Treffer gewinnt die frühere Station. */
function classify(name, learned, tplId, stations){
  var n = norm(name);
  var ids = stations.map(function(s){return s.id;});
  if(learned && learned[n] && ids.indexOf(learned[n]) >= 0) return learned[n];
  var tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  var kw = kwFor(tplId);
  var best = null, bestLen = 0;
  for(var ci=0; ci<stations.length; ci++){
    var st = stations[ci], list = kw[st.id] || [];
    if(!inTpl(tplId, st.id)){
      /* Eigene Stationen: Wörter aus dem Stationsnamen zählen als Schlüsselwörter. */
      list = norm(st.name).split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 4; }).map(function(w){ return {s:w, exact:false}; });
    }
    for(var ki=0; ki<list.length; ki++){
      var k = list[ki];
      var hit = k.exact ? tokens.indexOf(k.s) >= 0 : n.indexOf(k.s) >= 0;
      if(hit && k.s.length > bestLen){ best = st.id; bestLen = k.s.length; }
    }
  }
  return best || fallbackId(stations);
}
// ==CLASSIFY-END==

// ==DRAG-MATH-START==
/* rects: Position (top) und Höhe (h) jeder Zeile beim Start des Ziehens. i: gezogene Zeile. */
function dragTarget(rects, i, dy){
  var r = rects[i], c = r.top + r.h / 2 + dy, j = 0;
  for(var k = 0; k < rects.length; k++){
    if(k !== i && rects[k].top + rects[k].h / 2 < c) j++;
  }
  return j;
}
function dragFinal(rects, i, j){
  var r = rects[i];
  if(j > i) return rects[j].top + rects[j].h - (r.top + r.h);
  if(j < i) return rects[j].top - r.top;
  return 0;
}
function dragShift(rects, i, j, k, gap){
  var h = rects[i].h + gap;
  if(k === i) return 0;
  if(j > i && k > i && k <= j) return -h;
  if(j < i && k >= j && k < i) return h;
  return 0;
}
// ==DRAG-MATH-END==

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- Listen und Stationen ---------- */
function cur(){
  for(var i=0;i<state.lists.length;i++){ if(state.lists[i].id === state.listId) return state.lists[i]; }
  return null;
}
function visibleLists(){ return state.lists; }
function canManage(l){ return !!l && !!state.me.id && l.owner === state.me.id; }
function ensureCurrent(){
  var vis = visibleLists();
  if(vis.some(function(l){ return l.id === state.listId; })) return;
  var saved = lsGet(LS_CUR), pick = null;
  vis.forEach(function(l){ if(l.id === saved) pick = l; });
  state.listId = pick ? pick.id : (vis[0] ? vis[0].id : null);
}
function newListObj(name, tpl){
  var t = TPLS[tpl] || TPLS.eigen;
  return {name:name, tpl:TPLS[tpl] ? tpl : 'eigen', stations:t.stations.map(function(s){ return {id:s.id, name:s.name}; }), learned:{}};
}
function stationIds(l){ return l.stations.map(function(s){ return s.id; }); }
function effCat(l, cat){ return stationIds(l).indexOf(cat) >= 0 ? cat : fallbackId(l.stations); }
function stationName(l, id){ var s = l.stations.filter(function(x){ return x.id === id; })[0]; return s ? s.name : 'Sonstiges'; }
function stationNo(l, id){ var i = stationIds(l).indexOf(id); return i < 0 ? l.stations.length : i + 1; }
function listItems(l){ return state.items.filter(function(i){ return i.list === l.id; }); }

function normItem(id, d){
  if(!d || !d.name) return null;
  return {id:String(id), name:String(d.name), cat:String(d.cat || 'sonst'), done:!!d.done, ts:Date.parse(d.created_at) || 0, example:false, list:String(d.list_id || '')};
}
function normList(id, d){
  if(!d) return null;
  var tpl = TPLS[d.tpl] ? d.tpl : 'eigen', stations = [], seenIds = {};
  if(Array.isArray(d.stations)){
    d.stations.forEach(function(s){
      if(s && s.id && s.name && !seenIds[s.id]){ seenIds[s.id] = 1; stations.push({id:String(s.id), name:String(s.name)}); }
    });
  }
  if(!seenIds.sonst) stations.push({id:'sonst', name:'Sonstiges'});
  var learned = {};
  if(d.learned && typeof d.learned === 'object'){
    Object.keys(d.learned).forEach(function(k){ if(typeof d.learned[k] === 'string') learned[k] = d.learned[k]; });
  }
  return {id:String(id), name:String(d.name || 'Liste'), tpl:tpl, stations:stations, learned:learned,
          members:Array.isArray(d.members) ? d.members.slice() : [],
          owner:typeof d.owner === 'string' ? d.owner : null, ownerEmail:String(d.owner_email || ''), ts:Date.parse(d.created_at) || 0};
}
function sortLists(a, b){ return (a.ts||0) - (b.ts||0) || String(a.name).localeCompare(String(b.name)); }

/* ---------- Speicher (Supabase) ---------- */
function onWriteError(e){
  flashText('Nicht gespeichert. Prüft die Verbindung.');
  scheduleReload(0);
}
function upsertItem(it){
  if(!it) return;
  var i = state.items.findIndex(function(x){ return x.id === it.id; });
  if(i < 0) state.items.push(it); else state.items[i] = it;
}
async function loadAll(){
  if(!sb || !state.authed) return;
  try{
    var r = await Promise.all([
      sb.from('lists').select('*').order('created_at'),
      sb.from('list_members').select('list_id,email'),
      sb.from('items').select('*').order('created_at').range(0, 4999)
    ]);
    if(r[0].error || r[1].error || r[2].error) throw (r[0].error || r[1].error || r[2].error);
    var mem = {};
    r[1].data.forEach(function(m){ (mem[m.list_id] = mem[m.list_id] || []).push(m.email); });
    state.lists = r[0].data.map(function(d){ return normList(d.id, Object.assign({}, d, {members: mem[d.id] || []})); }).filter(Boolean).sort(sortLists);
    state.items = r[2].data.map(function(d){ return normItem(d.id, d); }).filter(Boolean);
    state.loaded = true;
    state.listsLoaded = true;
    if(state.mode !== 'live') state.mode = 'live';
    ensureCurrent();
    render();
  }catch(e){
    state.mode = 'lost';
    render();
  }
}
function scheduleReload(ms){
  clearTimeout(reloadT);
  reloadT = setTimeout(loadAll, ms === undefined ? 250 : ms);
}
function onItemChange(p){
  if(p.eventType === 'DELETE'){
    var id = p.old && p.old.id;
    state.items = state.items.filter(function(i){ return i.id !== id; });
  } else {
    upsertItem(normItem(p.new.id, p.new));
  }
  render();
}
function subscribe(){
  if(!sb) return;
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  chan = sb.channel('einkauf')
    .on('postgres_changes', {event:'*', schema:'public', table:'items'}, onItemChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'lists'}, function(){ scheduleReload(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'list_members'}, function(){ scheduleReload(); })
    .subscribe(function(status){
      if(status === 'SUBSCRIBED'){ state.mode = 'live'; renderHeader(); scheduleReload(0); }
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){ state.mode = 'lost'; renderHeader(); }
    });
}
var store = {
  addItem: function(item){
    return sb.from('items').insert({list_id:item.list, name:item.name, cat:item.cat, done:false}).select().single().then(function(r){
      if(r.error) throw r.error;
      upsertItem(normItem(r.data.id, r.data));
      render();
    }).catch(onWriteError);
  },
  updateItem: function(id, patch){
    var it = state.items.find(function(i){ return i.id === id; });
    if(it) Object.assign(it, patch);
    render();
    return sb.from('items').update(patch).eq('id', id).then(function(r){ if(r.error) onWriteError(r.error); });
  },
  removeItems: function(ids){
    if(!ids.length) return;
    state.items = state.items.filter(function(i){ return ids.indexOf(i.id) < 0; });
    render();
    return sb.from('items').delete().in('id', ids).then(function(r){ if(r.error) onWriteError(r.error); });
  },
  /* quiet: nur den Kopf neu zeichnen (z. B. beim Tippen eines Namens), damit nichts unter dem Finger verschwindet */
  patchList: function(id, patch, quiet){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l) return;
    var p = JSON.parse(JSON.stringify(patch)), dbp = {};
    Object.assign(l, p);
    ['name', 'stations', 'learned'].forEach(function(k){ if(k in p) dbp[k] = p[k]; });
    if(Object.keys(dbp).length) sb.from('lists').update(dbp).eq('id', id).then(function(r){ if(r.error) onWriteError(r.error); });
    if(quiet) renderHeader(); else render();
  },
  createList: function(name, tpl){
    return sb.from('lists').insert(newListObj(name, tpl)).select().single().then(function(r){
      if(r.error) throw r.error;
      var l = normList(r.data.id, Object.assign({}, r.data, {members: []}));
      state.lists.push(l);
      state.lists.sort(sortLists);
      return l.id;
    });
  },
  deleteList: function(id){
    state.items = state.items.filter(function(i){ return i.list !== id; });
    state.lists = state.lists.filter(function(l){ return l.id !== id; });
    return sb.from('lists').delete().eq('id', id).then(function(r){ if(r.error) onWriteError(r.error); });
  },
  addMember: function(id, email){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l || l.members.indexOf(email) >= 0) return;
    l.members.push(email);
    render();
    return sb.from('list_members').insert({list_id:id, email:email}).then(function(r){ if(r.error) onWriteError(r.error); });
  },
  removeMember: function(id, email){
    var l = state.lists.filter(function(x){ return x.id === id; })[0];
    if(!l) return;
    l.members = l.members.filter(function(m){ return m !== email; });
    render();
    return sb.from('list_members').delete().eq('list_id', id).eq('email', email).then(function(r){ if(r.error) onWriteError(r.error); });
  }
};

/* ---------- Aktionen ---------- */
function clsf(l, name){ return classify(name, l.learned, l.tpl, l.stations); }
function addItem(l, raw){
  var name = cap(raw.trim().replace(/\s+/g, ' '));
  if(!name) return null;
  var key = norm(name);
  var dup = listItems(l).find(function(i){ return norm(i.name) === key; });
  if(dup){
    if(dup.done){ store.updateItem(dup.id, {done:false}); return {status:'back', name:dup.name}; }
    return {status:'dup', name:dup.name};
  }
  var cat = clsf(l, name);
  store.addItem({name:name, cat:cat, done:false, ts:Date.now(), list:l.id});
  return {status:'added', name:name, cat:cat};
}
function addFromText(text){
  var l = cur();
  if(!l) return;
  var parts = text.split(/[,;\n]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  var res = parts.map(function(p){ return addItem(l, p); }).filter(Boolean);
  if(!res.length) return;
  if(res.length === 1){
    var r = res[0];
    if(r.status === 'added') flash(esc(r.name) + ' → ' + catHTML(l, r.cat));
    else if(r.status === 'back') flashText(r.name + ' ist wieder auf der Liste.');
    else flashText(r.name + ' steht schon auf der Liste.');
  } else {
    var n = res.filter(function(r){ return r.status !== 'dup'; }).length;
    flashText(n + ' Artikel hinzugefügt.');
  }
}
function moveStation(sid, to){
  var l = cur();
  if(!l) return false;
  var st = l.stations.slice(), from = stationIds(l).indexOf(sid);
  if(from < 0 || to < 0 || to >= st.length || to === from) return false;
  var m = st.splice(from, 1)[0];
  st.splice(to, 0, m);
  store.patchList(l.id, {stations: st});
  return true;
}

function renderHeader(){

  $('#listName').textContent = l ? l.name : 'manjo';

  $('#barFill').style.transform = 'scaleX(' + (total ? done / total : 0) + ')';

function itemHTML(i){
  var dis = state.canWrite ? '' : ' disabled';
  var isDone = !!i.done || !!pendingDone[i.id];
  var t = enterAt[i.id];
  if(t === undefined && seen && !seen.has(i.id)){ t = enterAt[i.id] = Date.now(); }
  var entering = t !== undefined && Date.now() - t < 240;
  var cls = 'item' + (isDone ? ' done' : '') + (pendingDone[i.id] ? ' checking' : '') + (entering ? ' enter' : '');
  return '<li class="' + cls + '"' + (entering ? ' data-t="' + t + '"' : '') + '>' +
    '<button class="row-main" role="checkbox" aria-checked="' + isDone + '" data-act="toggle" data-id="' + esc(i.id) + '"' + dis + '>' +
      '<span class="box">' + CHECK + '</span><span class="name">' + esc(i.name) + '</span></button>' +

function renderList(){
  var l = cur(), h = '';

    var waiting0 = state.mode === 'loading' || !state.listsLoaded;
    main.innerHTML = '<section class="empty"><h2>' + (waiting0 ? 'Wird geladen …' : 'Noch keine Liste') + '</h2>' +
      (waiting0 ? '' : '<p>Legt eine Liste für euren Laden an, zum Beispiel Supermarkt, Baumarkt oder IKEA. Oder lasst euch zu einer Liste einladen.</p>' +
        (state.canWrite ? '<div class="chips"><button class="chip" data-act="new-list-open-direct">Neue Liste</button></div>' : '')) +
      '</section>';
    return;
  }
  var its = listItems(l);
  if(!state.canWrite) h += '<div class="note"><p>Du kannst die Liste ansehen, aber nicht ändern. Bitte um Bearbeitungsrechte.</p></div>';
  if(state.mode === 'local') h += '<div class="note"><p>Gespeichert wird nur auf diesem Gerät. Gemeinsam funktioniert es, wenn ihr die geteilte Seite in Claude öffnet.</p></div>';
  if(its.some(function(i){ return i.example; })){

  if(waiting || !its.length){
    var samples = ({baumarkt:['Schrauben','Wandfarbe','Dübel','Silikon'], ikea:['Teelichter','Kissen','Box','Köttbullar'], drogerie:['Shampoo','Zahnpasta','Duschgel','Windeln'], eigen:[]}[l.tpl]) || ['Bananen','Hafermilch','Spülmittel','Brezn'];
    h += '<section class="empty"><h2>' + (waiting ? 'Liste wird geladen …' : 'Noch nichts auf der Liste') + '</h2>' +
      '<p>' + (l.tpl === 'eigen' ? 'Tippt unten einen Artikel ein. Legt in den Einstellungen (Zahnrad) eigene Stationen an, dann sortiert die App danach.' : 'Tippt unten einen Artikel ein. Die App ordnet ihn der passenden Station zu und sortiert die Liste nach eurer Route.') + '</p>';
    if(!waiting && state.canWrite && samples.length){
      h += '<div class="chips">' + samples.map(function(t){

      }).join('') + '</div>';
    }
    h += '</section>';
    main.innerHTML = h;
    return;
  }
  var open = its.filter(function(i){ return !i.done || pendingDone[i.id]; }).sort(byTs);
  var done = its.filter(function(i){ return i.done && !pendingDone[i.id]; }).sort(byTs);
  var by = {};
  open.forEach(function(i){ var c = effCat(l, i.cat); (by[c] = by[c] || []).push(i); });
  var stops = stationIds(l).filter(function(id){ return by[id]; });
  if(stops.length){
    h += '<ol class="route">' + stops.map(function(id){
      var no = stationNo(l, id);
      return '<li class="stop"><span class="badge" aria-hidden="true">' + no + '</span>' +

    h += '<section class="cart"><div class="cart-h"><h2>Im Wagen</h2><span class="count">' + done.length + '</span>' +
      (state.canWrite ? '<button class="link" data-act="clear-done">' + (state.confirmClear ? 'Wirklich leeren?' : 'Leeren') + '</button>' : '') +
      '</div><ul class="items">' + done.map(itemHTML).join('') + '</ul></section>';
  }
  main.innerHTML = h;
  /* Ein neuer Artikel blendet ein. Wird die Liste währenddessen neu gezeichnet, läuft die Animation dort weiter. */
  var now = Date.now();
  Array.prototype.forEach.call(main.querySelectorAll('.item[data-t]'), function(el){
    el.style.animationDelay = (-(now - (+el.dataset.t))) + 'ms';
  });
}

function renderSettings(){
  var l = cur(), h = '', dis = state.canWrite ? '' : ' disabled';
  if(l){
    var counts = {};
    listItems(l).forEach(function(i){ if(!i.done){ var c = effCat(l, i.cat); counts[c] = (counts[c] || 0) + 1; } });

function renderSheet(){

  $('#sheetTitle').textContent = c.title;
  $('#sheetSub').textContent = c.sub;
  $('#sheetSub').hidden = !c.sub;
  if(c.body !== sheetHtml){ sheetBody.innerHTML = c.body; sheetHtml = c.body; }
  overlay.hidden = false;
}

function render(){
  if(drag){ drag.dirty = true; return; }
  renderHeader();
  var typing = state.view === 'settings' && document.activeElement && main.contains(document.activeElement) && document.activeElement.tagName === 'INPUT' && document.activeElement.type !== 'radio';
  if(typing){ pendingRender = true; }
  else {
    pendingRender = false;
    if(state.view === 'list') renderList(); else renderSettings();
  }
  renderSheet();
  updateHint();
  if(state.loaded){
    if(!seen) seen = new Set();
    state.items.forEach(function(i){ seen.add(i.id); });
  }

function setView(v){

/* ---------- Ziehen der Stationen ---------- */
function startDrag(e, grip){
  var row = grip.closest('.ord');
  if(!row) return;
  var list = row.parentNode;
  var rows = Array.prototype.slice.call(list.children);
  var i = rows.indexOf(row);
  var rects = rows.map(function(r){ return {top: r.offsetTop, h: r.offsetHeight}; });
  var gap = rects.length > 1 ? rects[1].top - rects[0].top - rects[0].h : 0;
  drag = {pid:e.pointerId, row:row, rows:rows, rects:rects, gap:gap, i:i, j:i, cat:row.dataset.cat,
          startY:e.clientY, startScroll:main.scrollTop, y:e.clientY, raf:0, dirty:false, ended:false};
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  row.classList.add('lift');
  rows.forEach(function(r, k){ if(k !== i) r.classList.add('shift'); });
  main.classList.add('dragging');
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
  tick();
}
function applyDrag(){
  var d = drag;
  if(!d || d.ended) return;
  var rects = d.rects, r = rects[d.i], last = rects[rects.length - 1];
  var dy = (d.y - d.startY) + (main.scrollTop - d.startScroll);
  dy = Math.max(-r.top, Math.min(last.top + last.h - (r.top + r.h), dy));
  d.row.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
  var j = dragTarget(rects, d.i, dy);
  if(j !== d.j){
    d.j = j;
    d.rows.forEach(function(row, k){
      if(k === d.i) return;
      var s = dragShift(rects, d.i, j, k, d.gap);
      row.style.transform = s ? 'translateY(' + s + 'px)' : '';
    });
    var arr = d.rows.slice();
    var moved = arr.splice(d.i, 1)[0];
    arr.splice(j, 0, moved);
    arr.forEach(function(row, idx){ row.querySelector('.badge').textContent = idx + 1; });
  }
}
function tick(){
  var d = drag;
  if(!d || d.ended) return;
  var mr = main.getBoundingClientRect(), edge = 64, v = 0;
  if(d.y < mr.top + edge) v = -Math.ceil((mr.top + edge - d.y) / 6);
  else if(d.y > mr.bottom - edge) v = Math.ceil((d.y - (mr.bottom - edge)) / 6);
  v = Math.max(-14, Math.min(14, v));
  if(v) main.scrollTop += v;
  applyDrag();
  d.raf = requestAnimationFrame(tick);
}
function onDragMove(e){
  if(!drag || e.pointerId !== drag.pid) return;
  drag.y = e.clientY;
  applyDrag();
}
function onDragEnd(e){
  var d = drag;
  if(!d || d.ended || e.pointerId !== d.pid) return;
  d.ended = true;
  cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  var final = dragFinal(d.rects, d.i, d.j);
  d.row.classList.remove('lift');
  d.row.classList.add('drop');
  d.row.style.transform = 'translateY(' + final + 'px)';
  setTimeout(function(){
    var cat = d.cat, j = d.j, l = cur();
    drag = null;
    main.classList.remove('dragging');
    if(moveStation(cat, j) && l) announce(stationName(l, cat) + ', Position ' + (j + 1) + ' von ' + l.stations.length);
    focusFn = function(){ return main.querySelector('.grip[data-cat="' + sel(cat) + '"]'); };
    render();
  }, RM ? 0 : 200);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest && e.target.closest('.grip');
  if(!g || g.disabled || drag || !state.canWrite) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  startDrag(e, g);
});

document.addEventListener('click', function(e){
  if(e.target === overlay){ closeSheet(); return; }
  var b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  var act = b.dataset.act, id = b.dataset.id, l = cur();
  var it = id ? state.items.find(function(i){ return i.id === id; }) : null;
  if(act === 'settings'){
    setView('settings');
  } else if(act === 'back'){
    setView('list');
  } else if(act === 'lists'){
    openSheet({type:'lists'}, '[data-act="lists"]');
  } else if(act === 'pick-list'){
    switchList(id);
    closeSheet();
  } else if(act === 'new-list-open' || act === 'new-list-open-direct'){
    var first = state.sheet ? openerSel : null;
    openSheet({type:'new', tpl:'supermarkt', name:TPLS.supermarkt.name, edited:false}, first || (act === 'new-list-open-direct' ? '[data-act="new-list-open-direct"]' : null), '#newListName');
  } else if(act === 'tpl'){
    var s = state.sheet;
    if(s && s.type === 'new'){
      var wasDefault = !s.edited || s.name === TPLS[s.tpl].name || !s.name;
      s.tpl = b.dataset.tpl;
      if(wasDefault) s.name = s.tpl === 'eigen' ? 'Neue Liste' : TPLS[s.tpl].name;
      renderSheet();
    }
  } else if(act === 'toggle' && it){
    if(!state.canWrite) return;
    focusFn = function(){ return main.querySelector('[data-act="toggle"][data-id="' + sel(id) + '"]'); };
    if(pendingDone[id]){
      clearTimeout(pendingDone[id]);
      delete pendingDone[id];
      render();
    } else if(!it.done && !RM){
      pendingDone[id] = setTimeout(function(){
        delete pendingDone[id];
        store.updateItem(id, {done:true});
      }, 320);
      render();
    } else {
      store.updateItem(id, {done: !it.done});
    }
  } else if(act === 'more' && it){
    openSheet({type:'cat', id:id}, '[data-act="more"][data-id="' + sel(id) + '"]');
  } else if(act === 'close'){
    closeSheet();
  } else if(act === 'cat'){
    var cur2 = state.sheet && state.items.find(function(i){ return i.id === state.sheet.id; });
    var c = b.dataset.cat;
    if(cur2 && l && c !== effCat(l, cur2.cat)){
      store.updateItem(cur2.id, {cat: c});
      var learned = Object.assign({}, l.learned);
      learned[norm(cur2.name)] = c;
      var keys = Object.keys(learned);
      if(keys.length > 300){ keys.slice(0, keys.length - 300).forEach(function(k){ delete learned[k]; }); }
      store.patchList(l.id, {learned: learned}, true);
      flash(esc(cur2.name) + ' → ' + catHTML(l, c));
    }
    closeSheet();
  } else if(act === 'delete'){
    if(state.sheet) store.removeItems([state.sheet.id]);
    closeSheet();
  } else if(act === 'reset-order' && l){
    var tpl = TPLS[l.tpl];
    store.patchList(l.id, {stations: tpl.stations.map(function(s){ return {id:s.id, name:s.name}; })});
  } else if(act === 'del-station' && l){
    var sid = b.dataset.cat;
    if(sid === 'sonst') return;
    store.patchList(l.id, {stations: l.stations.filter(function(s){ return s.id !== sid; })});
    announce('Station entfernt.');
  } else if(act === 'rm-member' && l){
    store.removeMember(l.id, b.dataset.email);
  } else if(act === 'signout'){
    sb.auth.signOut();
  } else if(act === 'del-list' && l){
    if(state.lists.length < 2) return;
    if(!state.confirmDel){
      state.confirmDel = true;
      clearTimeout(delT);
      delT = setTimeout(function(){ state.confirmDel = false; if(state.view === 'settings') render(); }, 3500);
      render();
    } else {
      clearTimeout(delT);
      state.confirmDel = false;
      var gone = l.id;
      store.deleteList(gone);
      ensureCurrent();
      if(state.listId) lsSet(LS_CUR, state.listId);
      state.view = 'list';
      flashText('Liste gelöscht.');
      render();
    }
  } else if(act === 'sample'){
    if(state.canWrite) addFromText(b.dataset.text);
  } else if(act === 'clear-done' && l){
    if(!state.confirmClear){
      state.confirmClear = true;
      clearTimeout(clearT);
      clearT = setTimeout(function(){ state.confirmClear = false; render(); }, 3000);
      render();
    } else {
      clearTimeout(clearT);
      state.confirmClear = false;
      store.removeItems(listItems(l).filter(function(i){ return i.done; }).map(function(i){ return i.id; }));
      render();
    }
  } else if(act === 'clear-examples' && l){
    store.removeItems(listItems(l).filter(function(i){ return i.example; }).map(function(i){ return i.id; }));
  }
});

document.addEventListener('change', function(e){

main.addEventListener('focusout', function(){

document.addEventListener('keydown', function(e){
  if(!overlay.hidden){
    if(e.key === 'Escape'){ closeSheet(); return; }
    if(e.key === 'Tab'){
      var f = Array.prototype.slice.call(overlay.querySelectorAll('button:not(:disabled), input'));
      if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(e.key === 'Enter' && e.target.matches && e.target.matches('.station-in, #listNameInput')){ e.preventDefault(); e.target.blur(); return; }
  var g = e.target.closest && e.target.closest('.grip');
  if(g && !g.disabled && !drag && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    var l = cur();
    if(!l) return;
    var cat = g.dataset.cat, from = stationIds(l).indexOf(cat);
    if(moveStation(cat, from + (e.key === 'ArrowUp' ? -1 : 1))){
      var l2 = cur(), to = stationIds(l2).indexOf(cat);
      announce(stationName(l2, cat) + ', Position ' + (to + 1) + ' von ' + l2.stations.length);
      focusFn = function(){ return main.querySelector('.grip[data-cat="' + sel(cat) + '"]'); };
      render();
    }
  }
});

document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id === 'newListForm'){

    if(em === l0.ownerEmail || l0.members.indexOf(em) >= 0){ flashText('Diese Person ist schon dabei.'); return; }
    focusFn = function(){ return $('#memberEmail'); };

    focusFn = function(){ return $('#newStation'); };

  }

  signup = on;
  $('#authSubmit').textContent = on ? 'Konto erstellen' : 'Anmelden';
  $('#authToggle').textContent = on ? 'Schon ein Konto? Anmelden' : 'Neu hier? Konto erstellen';
  $('#authPw').autocomplete = on ? 'new-password' : 'current-password';
  authMsg('');
}
async function doAuth(){
  if(!sb) return;
  var email = $('#authEmail').value.trim().toLowerCase(), pw = $('#authPw').value;
  if(!email || !pw){ authMsg('Bitte E-Mail und Passwort eingeben.', true); return; }
  if(signup && pw.length < 8){ authMsg('Das Passwort braucht mindestens 8 Zeichen.', true); return; }
  authMsg('Einen Moment …');
  $('#authSubmit').disabled = true;
  try{
    if(signup){
      var r = await sb.auth.signUp({email: email, password: pw});
      if(r.error) authMsg(/registered/i.test(r.error.message) ? 'Zu dieser Adresse gibt es schon ein Konto. Meldet euch an.' : 'Das hat nicht geklappt: ' + r.error.message, true);
      else if(!r.data.session) authMsg('Fast fertig: Wir haben euch eine Bestätigungsmail geschickt. Danach hier anmelden.');
    } else {
      var r2 = await sb.auth.signInWithPassword({email: email, password: pw});
      if(r2.error) authMsg(/confirm/i.test(r2.error.message) ? 'Bitte zuerst die Adresse per Mail bestätigen.' : 'E-Mail oder Passwort stimmt nicht.', true);
    }
  }catch(e){ authMsg('Keine Verbindung. Versucht es gleich nochmal.', true); }
  $('#authSubmit').disabled = false;
}
function onSignedIn(session){
  if(state.authed) return;
  state.authed = true;
  state.me = {id: session.user.id, email: String(session.user.email || '').toLowerCase()};
  state.mode = 'loading';
  showAuth(false);
  render();
  loadAll();
  subscribe();
}
function onSignedOut(){
  state.authed = false;
  state.me = {id:null, email:''};
  state.lists = []; state.items = []; state.listId = null; state.loaded = false; state.listsLoaded = false;
  state.view = 'list'; state.sheet = null; state.mode = 'loading';
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  $('#authPw').value = '';
  showAuth(true);
  overlay.hidden = true;
}
$('#authToggle').addEventListener('click', function(){ setSignup(!signup); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && state.authed){
    if(state.mode === 'lost') subscribe();
    scheduleReload(0);
  }
});
window.addEventListener('online', function(){ if(state.authed){ subscribe(); scheduleReload(0); } });

(async function boot(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if(!CFG.url || !CFG.key || !window.supabase){
    showAuth(true);
    $('#authForm').hidden = true;
    $('#authToggle').hidden = true;
    $('#authLead').textContent = window.supabase ? 'Trage in config.js die URL und den Anon-Key deines Supabase-Projekts ein.' : 'Die Supabase-Bibliothek konnte nicht geladen werden. Prüft die Internetverbindung.';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(function(ev, session){
    if(ev === 'SIGNED_OUT') onSignedOut();
    else if(session && !state.authed) onSignedIn(session);
  });
  var s = await sb.auth.getSession();
  if(s.data && s.data.session) onSignedIn(s.data.session); else showAuth(true);
})();

})();
</script>
</body>
</html>
